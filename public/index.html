<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BNR — Bank Nusantara Roblox</title>
    
    <!-- PWA & Theme -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#990000">
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">

    <!-- Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bnr: {
                            red: '#CC0000',
                            darkred: '#800000',
                            lightred: '#FFEBEE',
                            accent: '#990000',
                            dark: '#0F172A',
                            surface: '#F8FAFC',
                            card: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">

    <!-- App Configuration, Theme, API Client & Auth Guard -->
    <script src="/js/config.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/api.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans antialiased selection:bg-bnr-red selection:text-white min-h-screen flex items-center justify-center p-6">

    <!-- SPLASH SCREEN LOADING -->
    <div class="relative flex flex-col items-center max-w-sm w-full text-center page-fade-enter">
        <div class="relative mb-6">
            <div class="absolute -inset-4 rounded-full bg-bnr-red/30 blur-xl animate-pulse"></div>
            <img src="/assets/images/bnr-logo.svg" alt="BNR Logo" class="bnr-brand-logo relative w-28 h-28 object-contain rounded-2xl shadow-2xl transition-transform duration-500 scale-100">
        </div>
        <h1 class="text-3xl font-extrabold tracking-wider text-white mb-1">BNR</h1>
        <p class="text-xs font-semibold tracking-widest text-slate-400 uppercase mb-8">Bank Nusantara Roblox</p>
        
        <div class="w-full bg-slate-800 rounded-full h-2 mb-4 overflow-hidden p-0.5 border border-slate-700">
            <div id="progressBar" class="bg-gradient-to-r from-bnr-red to-red-500 h-full rounded-full w-0 transition-all duration-300 ease-out"></div>
        </div>
        
        <div class="flex justify-between w-full text-xs text-slate-400 font-mono">
            <span id="loadingStatus">Menghubungkan server...</span>
            <span id="loadingPercent">0%</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progressBar');
            const loadingPercent = document.getElementById('loadingPercent');
            const loadingStatus = document.getElementById('loadingStatus');

            const steps = [
                { percent: 25, status: 'Menghubungkan sistem aman...' },
                { percent: 55, status: 'Memverifikasi sesi nasabah...' },
                { percent: 85, status: 'Menyiapkan enkripsi BNR...' },
                { percent: 100, status: 'Mengarahkan...' }
            ];

            let currentStep = 0;
            const interval = setInterval(() => {
                if (currentStep < steps.length) {
                    const step = steps[currentStep];
                    progressBar.style.width = `${step.percent}%`;
                    loadingPercent.textContent = `${step.percent}%`;
                    loadingStatus.textContent = step.status;
                    currentStep++;
                } else {
                    clearInterval(interval);
                    setTimeout(() => {
                        const isAuth = window.bnrApi && window.bnrApi.isAuthenticated();
                        if (isAuth) {
                            window.location.href = '/pages/dashboard.html';
                        } else {
                            window.location.href = '/pages/login.html';
                        }
                    }, 400);
                }
            }, 250);
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('BNR SW Registered:', reg.scope))
                    .catch(err => console.log('BNR SW Failed:', err));
            });
        }
    </script>
</body>
</html>
