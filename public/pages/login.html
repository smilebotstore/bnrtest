<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masuk ke Layanan — BNR</title>
    
    <!-- PWA & Theme -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#990000">
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">

    <!-- Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bnr: {
                            red: '#CC0000',
                            darkred: '#800000',
                            lightred: '#FFEBEE',
                            accent: '#990000',
                            dark: '#0F172A',
                            surface: '#F8FAFC',
                            card: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Icons & SweetAlert -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">

    <!-- App Configuration, Theme, API Client & Auth Guard -->
    <script src="/js/config.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth-guard.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased selection:bg-bnr-red selection:text-white min-h-screen flex items-center justify-center p-4">

    <!-- LOGIN CONTAINER -->
    <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-2xl border border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden page-fade-enter">
        <!-- Ambient Red Glow -->
        <div class="absolute -top-24 -right-24 w-52 h-52 bg-bnr-red/25 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-52 h-52 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Brand Header -->
        <div class="flex flex-col items-center text-center mb-8 relative">
            <img src="/assets/images/bnr-logo.svg" alt="BNR Logo" class="bnr-brand-logo w-20 h-20 object-contain mb-3 drop-shadow-xl">
            <h2 class="text-2xl font-extrabold text-white tracking-tight">BNR</h2>
            <p class="text-xs text-slate-400 uppercase tracking-widest font-semibold mt-0.5">Bank Nusantara Roblox</p>
            <span class="mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse mr-1.5"></span>
                Sistem Perbankan Virtual Aktif
            </span>
        </div>

        <!-- Form Login -->
        <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Username Nasabah</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </span>
                    <input type="text" id="username" required autocomplete="username"
                           class="w-full bg-slate-900/90 border border-slate-700 text-white rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-bnr-red focus:ring-1 focus:ring-bnr-red transition" 
                           placeholder="Masukkan username Roblox / Nasabah">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Kata Sandi</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                    </span>
                    <input type="password" id="password" required autocomplete="current-password"
                           class="w-full bg-slate-900/90 border border-slate-700 text-white rounded-xl pl-11 pr-11 py-3 text-sm focus:outline-none focus:border-bnr-red focus:ring-1 focus:ring-bnr-red transition" 
                           placeholder="Masukkan kata sandi">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white">
                        <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="rememberMe" checked class="rounded bg-slate-900 border-slate-700 text-bnr-red focus:ring-0">
                    <span>Ingat sesi di perangkat ini</span>
                </label>
            </div>

            <button type="submit" id="btnLogin" class="w-full mt-2 bg-gradient-to-r from-bnr-red to-red-700 hover:from-red-700 hover:to-bnr-darkred text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-red-950/40 transition duration-200 flex items-center justify-center space-x-2">
                <span>Masuk ke Layanan</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="mt-8 pt-5 border-t border-slate-700/60 text-center">
            <p class="text-[11px] text-slate-400 flex items-center justify-center space-x-1.5">
                <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400 inline"></i>
                <span>Enkripsi Server Terlindungi &bull; BNR v2.0</span>
            </p>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwd.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Memverifikasi...</span>`;
            lucide.createIcons();

            try {
                const res = await window.bnrApi.login(usernameInput, passwordInput);
                Swal.fire({
                    icon: 'success',
                    title: 'Selamat Datang!',
                    text: `Login berhasil sebagai ${res.user.name}`,
                    timer: 1200,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = '/pages/dashboard.html';
                });
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal Masuk',
                    text: err.message || 'Terjadi kesalahan saat masuk.',
                    confirmButtonColor: '#CC0000'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Masuk ke Layanan</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
                lucide.createIcons();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
