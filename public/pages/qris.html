<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pembayaran QRIS — BNR</title>
    
    <!-- PWA & Theme -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#990000">
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">

    <!-- Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bnr: {
                            red: '#CC0000',
                            darkred: '#800000',
                            lightred: '#FFEBEE',
                            accent: '#990000',
                            dark: '#0F172A',
                            surface: '#F8FAFC',
                            card: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Icons & SweetAlert -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">

    <!-- App Configuration, Theme, API Client & Auth Guard -->
    <script src="/js/config.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth-guard.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-bnr-red selection:text-white min-h-screen">

    <!-- APP SHELL CONTAINER -->
    <div id="appLayout" class="min-h-screen flex flex-col md:flex-row">
        
        <!-- QRIS CONTENT -->
        <div class="max-w-md mx-auto w-full space-y-6 page-fade-enter">
            
            <!-- QRIS CARD -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-sm text-center">
                
                <div class="flex items-center justify-center space-x-2 mb-4">
                    <img src="/assets/images/bnr-logo.svg" alt="BNR" class="w-8 h-8 object-contain">
                    <h3 class="font-extrabold text-base tracking-wider uppercase text-slate-900 dark:text-white">QRIS BNR VIRTUAL</h3>
                </div>

                <p class="text-xs text-slate-400 mb-6">Pindai kode QR untuk menerima atau mentransfer saldo secara instan</p>

                <!-- Simulated QR Container -->
                <div class="p-4 bg-white rounded-3xl border-2 border-slate-100 shadow-inner inline-block mx-auto mb-4">
                    <div id="qrPlaceholder" class="w-52 h-52 bg-slate-50 border border-slate-200 rounded-2xl flex flex-col items-center justify-center p-3 relative overflow-hidden">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=BNR-VIRTUAL-TRANSFER" 
                             alt="QRIS Code" id="qrisImage" class="w-full h-full object-contain"
                             onerror="this.src='/assets/images/bnr-logo.svg'">
                    </div>
                </div>

                <div class="space-y-1 mb-6">
                    <h4 class="font-bold text-sm text-slate-900 dark:text-white" id="qrisOwnerName">Loading...</h4>
                    <p class="font-mono text-xs text-bnr-red font-semibold tracking-wider" id="qrisAccountNo">1200000000</p>
                    <p class="text-[10px] text-slate-400 font-medium">Bank Nusantara Roblox &bull; Standar QRIS Indonesia</p>
                </div>

                <!-- Action Button -->
                <div class="space-y-3">
                    <button type="button" onclick="promptSimulatedQRScan()" class="w-full py-3.5 bg-gradient-to-r from-bnr-red to-red-700 hover:from-red-700 hover:to-bnr-darkred text-white font-semibold rounded-xl text-xs flex items-center justify-center space-x-2 shadow-lg transition">
                        <i data-lucide="scan" class="w-4 h-4"></i>
                        <span>Scan / Bayar Menggunakan QRIS</span>
                    </button>
                    <a href="/pages/transfer.html" class="block w-full py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold rounded-xl text-xs transition">
                        Gunakan Transfer Manual
                    </a>
                </div>

            </div>

        </div>
    </div>

    <!-- Components loader -->
    <script src="/js/components.js"></script>

    <script>
        async function initQRIS() {
            try {
                const res = await window.bnrApi.getAccountDetails();
                const acc = res.account;
                document.getElementById('qrisOwnerName').textContent = acc.ownerName;
                document.getElementById('qrisAccountNo').textContent = acc.accountNumber;
                
                // Set QR content to BNR standard payload
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=BNR:${acc.accountNumber}:${encodeURIComponent(acc.ownerName)}`;
                document.getElementById('qrisImage').src = qrUrl;
            } catch (err) {
                console.error('Failed to init QRIS', err);
            }
        }

        function promptSimulatedQRScan() {
            Swal.fire({
                title: 'Scan QRIS Rekening BNR',
                text: 'Masukkan nomor rekening atau kode QRIS tujuan transfer:',
                input: 'text',
                inputPlaceholder: 'Contoh: 1200000001',
                showCancelButton: true,
                confirmButtonColor: '#CC0000',
                confirmButtonText: 'Lanjutkan',
                cancelButtonText: 'Batal',
                inputValidator: (value) => {
                    if (!value) {
                        return 'Nomor rekening atau kode QRIS tidak boleh kosong!';
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    let cleanAcc = result.value.replace(/[^0-9]/g, '');
                    window.location.href = `/pages/transfer.html?to=${cleanAcc}`;
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initQRIS();
        });
    </script>
</body>
</html>
