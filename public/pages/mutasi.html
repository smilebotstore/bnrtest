<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mutasi Rekening — BNR</title>
    
    <!-- PWA & Theme -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#990000">
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">

    <!-- Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bnr: {
                            red: '#CC0000',
                            darkred: '#800000',
                            lightred: '#FFEBEE',
                            accent: '#990000',
                            dark: '#0F172A',
                            surface: '#F8FAFC',
                            card: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Icons & SweetAlert -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">

    <!-- App Configuration, Theme, API Client & Auth Guard -->
    <script src="/js/config.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth-guard.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-bnr-red selection:text-white min-h-screen">

    <!-- APP SHELL CONTAINER -->
    <div id="appLayout" class="min-h-screen flex flex-col md:flex-row">
        
        <!-- MUTATION CONTENT -->
        <div class="space-y-6 page-fade-enter">
            
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-sm">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-6 border-b border-slate-100 dark:border-slate-800 gap-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-2xl bg-blue-500/10 text-blue-500 flex items-center justify-center">
                            <i data-lucide="receipt-text" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-base sm:text-lg text-slate-900 dark:text-white">Mutasi & Riwayat Rekening</h3>
                            <p class="text-xs text-slate-400">Daftar lengkap seluruh arus kas masuk dan keluar di rekening Anda</p>
                        </div>
                    </div>

                    <!-- Filter Tabs -->
                    <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl text-xs font-semibold">
                        <button type="button" onclick="setFilter('ALL')" id="filterAll" class="px-3.5 py-1.5 rounded-xl bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition">Semua</button>
                        <button type="button" onclick="setFilter('CREDIT')" id="filterCredit" class="px-3.5 py-1.5 rounded-xl text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition">Masuk</button>
                        <button type="button" onclick="setFilter('DEBIT')" id="filterDebit" class="px-3.5 py-1.5 rounded-xl text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition">Keluar</button>
                    </div>
                </div>

                <!-- Search Input -->
                <div class="my-4">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                            <i data-lucide="search" class="w-4 h-4"></i>
                        </span>
                        <input type="text" id="searchInput" oninput="applySearch()" 
                               class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl pl-10 pr-4 py-2.5 text-xs focus:outline-none focus:border-bnr-red transition" 
                               placeholder="Cari transaksi berdasarkan nama penerima, pengirim, ID atau catatan...">
                    </div>
                </div>

                <!-- Mutation List -->
                <div id="mutationList" class="space-y-3 mt-4">
                    <div class="text-center py-10 text-slate-400 text-xs">
                        <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-slate-400"></i>
                        <p>Memuat catatan transaksi...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Components loader -->
    <script src="/js/components.js"></script>

    <script>
        let allTransactions = [];
        let activeFilter = 'ALL';

        function formatCurrency(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount);
        }

        async function loadMutations() {
            try {
                const res = await window.bnrApi.getTransactionHistory();
                allTransactions = res.transactions || [];
                renderTransactions();
            } catch (err) {
                console.error('Failed to load mutations', err);
            }
        }

        function setFilter(filter) {
            activeFilter = filter;
            const btnAll = document.getElementById('filterAll');
            const btnCredit = document.getElementById('filterCredit');
            const btnDebit = document.getElementById('filterDebit');

            [btnAll, btnCredit, btnDebit].forEach(b => {
                b.className = 'px-3.5 py-1.5 rounded-xl text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition';
            });

            if (filter === 'ALL') btnAll.className = 'px-3.5 py-1.5 rounded-xl bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition';
            if (filter === 'CREDIT') btnCredit.className = 'px-3.5 py-1.5 rounded-xl bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition';
            if (filter === 'DEBIT') btnDebit.className = 'px-3.5 py-1.5 rounded-xl bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition';

            renderTransactions();
        }

        function applySearch() {
            renderTransactions();
        }

        function renderTransactions() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('mutationList');

            let filtered = allTransactions.filter(tx => {
                const isDebit = tx.role === 'DEBIT' || tx.type === 'FEE_CHANGE_NAME';
                if (activeFilter === 'CREDIT' && isDebit) return false;
                if (activeFilter === 'DEBIT' && !isDebit) return false;

                if (query) {
                    const matchId = (tx.id || '').toLowerCase().includes(query);
                    const matchSender = (tx.senderName || '').toLowerCase().includes(query);
                    const matchReceiver = (tx.receiverName || '').toLowerCase().includes(query);
                    const matchNote = (tx.note || '').toLowerCase().includes(query);
                    return matchId || matchSender || matchReceiver || matchNote;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 text-xs">
                        <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-30"></i>
                        <p>Tidak ada transaksi yang cocok dengan kriteria filter.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = filtered.map(tx => {
                const isDebit = tx.role === 'DEBIT' || tx.type === 'FEE_CHANGE_NAME';
                const icon = isDebit ? 'arrow-up-right' : 'arrow-down-left';
                const iconColor = isDebit ? 'text-rose-500 bg-rose-500/10' : 'text-emerald-500 bg-emerald-500/10';
                const amountColor = isDebit ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-600 dark:text-emerald-400';
                const sign = isDebit ? '-' : '+';
                const counterparty = isDebit ? `Ke: ${tx.receiverName || 'Sistem'}` : `Dari: ${tx.senderName || 'Sistem'}`;
                const dateStr = new Date(tx.timestamp).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });

                return `
                    <div class="p-4 bg-slate-50 dark:bg-slate-800/40 rounded-2xl border border-slate-200/80 dark:border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:border-slate-300 dark:hover:border-slate-700 transition">
                        <div class="flex items-center space-x-3.5">
                            <div class="w-10 h-10 rounded-xl ${iconColor} flex items-center justify-center shrink-0">
                                <i data-lucide="${icon}" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-slate-800 dark:text-white">${tx.note || (isDebit ? 'Transfer Keluar' : 'Transfer Masuk')}</p>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400">${counterparty} &bull; <span class="font-mono text-[10px] text-slate-400">${tx.id}</span></p>
                                <span class="text-[10px] text-slate-400 font-mono mt-0.5 block">${dateStr}</span>
                            </div>
                        </div>
                        <div class="text-right sm:text-right flex sm:flex-col justify-between items-center sm:items-end border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-200/50 dark:border-slate-700/50">
                            <span class="font-mono font-extrabold text-sm ${amountColor}">
                                ${sign} ${formatCurrency(tx.amount)}
                            </span>
                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                                ${tx.status}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadMutations();
        });
    </script>
</body>
</html>
