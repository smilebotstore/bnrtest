[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  NODE_VERSION = "18"

# API Serverless Function Redirect
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Single Page App & Clean URL Routing (Keeps /dashboard, /transfer clean without .html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
